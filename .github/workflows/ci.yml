name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push to a pull request cancels its older run; runs on main are never cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Exercise the selected supported minor, rather than auto-switching to go.mod's development toolchain.
      GOTOOLCHAIN: local
    strategy:
      matrix:
        go: ['1.25', '1.26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go build ./...
      - run: go test -race ./...
